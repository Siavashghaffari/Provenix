name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The packaging regression guard. The tool map and the HTML template are
  # read at runtime; if they ever drop out of the wheel, the source tree keeps
  # working and only an installed copy breaks. This job installs the built
  # wheel into an environment with no source on the path and exercises the
  # paths that need those files.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel --outdir dist

      - name: Install the wheel somewhere with no source tree
        run: |
          mkdir -p /tmp/isolated
          python -m venv /tmp/isolated/venv
          /tmp/isolated/venv/bin/pip install --quiet dist/*.whl

      - name: No third-party dependencies were pulled in
        run: |
          extra=$(/tmp/isolated/venv/bin/pip list --format=freeze \
            | grep -vE '^(provenix|pip|setuptools|wheel)=' || true)
          if [ -n "$extra" ]; then echo "unexpected dependencies:"; echo "$extra"; exit 1; fi

      - name: The CLI runs, and the packaged data files are readable
        working-directory: /tmp/isolated
        run: |
          set -eu
          V=/tmp/isolated/venv/bin/provenix

          # `provenix check` exits 1 when a finding is at or above --fail-on.
          # That is the CI gate contract, not an error, so every invocation
          # below declares the exit code it expects. Ignoring the code with
          # `|| true` would also swallow a genuine crash (exit 2).
          expect() {
            want="$1"; shift
            got=0
            "$@" || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "::error::expected exit $want but got $got from: $*"
              exit 1
            fi
          }

          # Reads data/stochastic_tools.yml.
          expect 0 $V list-checks
          test "$($V list-checks | grep -c '^PVX')" -eq 13

          # A minimal pipeline, built here so the check has real input. Its
          # container is `:latest`, so PVX001 fires and the default
          # `--fail-on critical` makes every check below exit 1.
          mkdir -p pipe/modules
          printf "manifest { version = '1.0.0' }\n" > pipe/nextflow.config
          printf "process P {\n    container 'biocontainers/bwa:latest'\n\n    script:\n    \"\"\"\n    bwa mem\n    \"\"\"\n}\n" > pipe/modules/main.nf

          expect 1 $V check pipe --format json --output out.json
          python -c "import json;d=json.load(open('out.json'));assert any(f['id']=='PVX001' for f in d['findings']),d"

          # Reads report/template.html.
          expect 1 $V check pipe --format html --output out.html
          grep -q '<style>' out.html

          # The exit-code contract itself.
          expect 0 $V check pipe --fail-on none
          expect 1 $V check pipe --fail-on critical
          expect 2 $V check /nonexistent-pipeline
