# Test fixtures deliberately contain credential-shaped strings: PVX030 exists
# to find them, so the suite has to feed it something that looks real.
#
# Vendor-shaped values are generated at run time and never committed (see
# tests/conftest.py), and a test asserts no committed file carries one. This
# file is the second line of defence, for fixtures added later.
paths-ignore:
  - "tests/fixtures/**"
